name: tests

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches:
      - develop
    paths-ignore:
      - "**.md"
permissions:
  id-token: write
  contents: read

jobs:
  # Fast, deterministic baseline suite for the findings panel (PR 1).
  # No repo clones, no --config=auto, no network for the OSS legs. The optional
  # Pro/logged-in leg runs only when SEMGREP_APP_TOKEN is present (test org only,
  # never a customer org) and records the Pro diagnostic shape as an artifact.
  vsce-test-hermetic:
    runs-on: ubuntu-latest
    # Surface the secret as a job-level env var so step `if:` guards can test it.
    # Empty when the secret is unset (e.g. on forks) — the Pro leg then skips.
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Install Semgrep (OSS oracle / fallback engine)
        run: python -m pip install semgrep
      - name: Setup
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: lts/*
      - name: install dependencies
        run: npm ci
      - name: pretest
        run: npm run pretest
      - name: run hermetic baseline suite (OSS)
        run: xvfb-run -a npm run test-hermetic
      # Optional Pro/logged-in leg: only when a test-org token is configured.
      # Login is performed via the token; the suite records what the bundled
      # Pro engine + deployment policy emit (4th severity level? product tag?).
      - name: run hermetic suite (Pro + logged-in policy)
        if: ${{ env.SEMGREP_APP_TOKEN != '' }}
        run: xvfb-run -a npm run test-hermetic
      - name: upload Pro diagnostic recording
        if: ${{ always() && env.SEMGREP_APP_TOKEN != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pro-diagnostics
          path: ./pro-diagnostics.json
          if-no-files-found: ignore

  vsce-test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Install Semgrep
        run: python -m pip install semgrep
      - name: Setup
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: lts/*
      - name: install dependencies
        run: npm ci
      - uses: "aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502" # v4.0.2
        with:
          role-to-assume: "arn:aws:iam::338683922796:role/semgrep-ide-integration-deploy-role"
          role-duration-seconds: 900,
          role-session-name: "semgrep-ide-integration-deploy"
          aws-region: "us-west-2"
      - if: matrix.os == 'macos-latest'
        name: download osemgrep pro
        run: ./download-osemgrep-pro.sh darwin-arm64
      - if: matrix.os == 'ubuntu-latest'
        name: download osemgrep pro
        run: ./download-osemgrep-pro.sh linux-x64
      - name: pretest
        run: npm run pretest
      - name: run tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test
      - name: run tests (MacOS)
        if: matrix.os == 'macos-latest'
        run: npm run test
      - name: uninstall semgrep
        run: python -m pip uninstall -y semgrep && rm dist/osemgrep-pro
      - name: upload semgrep results for windows
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-results
          path: ./*_results.json
  vsce-test-windows:
    needs: vsce-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: lts/*
      - name: install dependencies
        run: npm ci
        # This is needed so download-lspjs.sh can run
      - name: configure npm
        run: npm config set script-shell "C:\\Program Files\\Git\\Bin\\bash.exe"
        # windows doesn't like long paths :(
      - name: Support longpaths
        run: git config --system core.longpaths true
      - name: pretest
        run: npm run pretest
      - name: download semgrep results from linux
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: semgrep-results
          path: ./

  vsce-prepublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: lts/*
      - uses: "aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502" # v4.0.2
        with:
          role-to-assume: "arn:aws:iam::338683922796:role/semgrep-ide-integration-deploy-role"
          role-duration-seconds: 900,
          role-session-name: "semgrep-ide-integration-deploy"
          aws-region: "us-west-2"
      - name: download osemgrep pro
        run: ./download-osemgrep-pro.sh linux-x64
      - run: npm ci
      - run: npm run vscode:prepublish
